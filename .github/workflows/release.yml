name: Release

# A version tag (v2.0.0, ...) builds installers for every platform and drafts a
# release. Nothing is published until the draft is reviewed by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Installers for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # build provenance
      attestations: write   # build provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Fetch the bundled rclone (checksum-verified)
        shell: bash
        run: scripts/fetch-rclone.sh ${{ matrix.target }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: tauri-cli@2
      - name: Build
        run: cargo tauri build
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;
          ls -la dist
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: dist/*

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-cyclonedx
      - name: CycloneDX SBOM of the Rust core
        working-directory: src-tauri
        run: |
          cargo cyclonedx --format json
          mkdir -p ../dist && cp ./*.cdx.json ../dist/decant-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/*

  draft:
    name: Draft the release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # The notes are this version's section of CHANGELOG.md, then how to check
      # a download. A tag with no changelog section fails here rather than
      # drafting a release with nothing to say. The tag reaches the script
      # through the environment, never pasted into it.
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ## Check your download

          `SHA256SUMS` holds the SHA-256 of every other file in this release. Check an installer against it before you run it:

          - **Windows** (PowerShell): `Get-FileHash .\<installer>`, then compare the hash with that file's line in `SHA256SUMS`.
          - **macOS:** `shasum -a 256 <installer>`, and compare the same way.
          - **Linux:** `sha256sum --ignore-missing -c SHA256SUMS`

          To confirm an installer was built from this repository by its release workflow, with the [GitHub CLI](https://cli.github.com/):

          ```
          gh attestation verify <installer> --repo ${{ github.repository }}
          ```

          `decant-sbom.cdx.json` lists every Rust component inside the app. The installers are not code-signed yet (that is planned for 2.5), so Windows warns before the first launch, and macOS may not open the app until you allow it in System Settings, under Privacy & Security.
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          name: Decant ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
