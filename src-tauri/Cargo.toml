[package]
name = "decant"
version = "2.0.0"
description = "Move files to the cloud, prove every one arrived intact, then free the space."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dezdickey/Decant"
publish = false

[lib]
name = "decant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
getrandom = "0.2"
trash = "5.2.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
proptest = "1.12.0"
